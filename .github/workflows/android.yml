name: Android APK

# 안드로이드판(WarOfGenesis.Android) APK 를 굽는다.
#  - android-v* 태그를 밀면: APK 를 구워 그 태그 이름으로 Releases 에 올린다.
#    PC 판 태그(v*, release.yml)와 이름이 달라 서로의 워크플로를 깨우지 않는다 — 안드로이드 태그는 꼭 android- 를 붙인다.
#  - 안드로이드 쪽 파일이나 끌어 쓰는 PC 판 코드를 고쳐 브랜치에 밀거나 수동 실행하면: 굽기만 하고 Actions 아티팩트로 남긴다.
#  원본 게임 자료는 APK 에 넣지 않는다(사용자가 폰의 WarOfGenesis 폴더에 넣는다 — docs/포팅-계획.md).
on:
  push:
    tags:
      - 'android-v*'
    branches:
      - '**'
    paths:
      - 'WarOfGenesis.Android/**'
      - 'WarOfGenesis.Assets/**'
      - 'duel-dx/**'
      - 'assets/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

env:
  # 다음에 낼 안드로이드판 번호 — 브랜치에서 구운 APK(아티팩트)도 이 번호로 낸다.
  APP_VERSION: '0.1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Version
        id: version
        run: |
          # 앱 버전 — 태그(android-vX.Y.Z)면 그 번호, 브랜치 빌드면 다음에 낼 판 번호(APP_VERSION)를 쓴다.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            v="${GITHUB_REF_NAME#android-v}"
          else
            v="${APP_VERSION}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "버전: $v (빌드 번호 $GITHUB_RUN_NUMBER)"

      # 러너에 깔린 SDK 에 이 워크로드가 바라는 플랫폼/빌드 도구가 없으면 채운다.
      - name: Install Android dependencies
        run: >
          dotnet build WarOfGenesis.Android/WarOfGenesis.Android.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      # 서명은 디버그 키다(러너가 그때그때 만든다) — 새 버전을 깔려면 옛 앱을 지우고 깔아야 할 수 있다.
      - name: Publish APK
        run: >
          dotnet publish WarOfGenesis.Android/WarOfGenesis.Android.csproj
          -c Release -f net10.0-android -o out
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }}
          -p:ApplicationVersion=${{ github.run_number }}

      - name: Collect APK
        id: apk
        run: |
          src=$(find out -name '*-Signed.apk' | head -n 1)
          if [[ -z "$src" ]]; then echo "서명된 APK 가 없습니다"; find out; exit 1; fi
          dst="WarOfGenesis-${{ steps.version.outputs.version }}.apk"
          cp "$src" "$dst"
          ls -l "$dst"
          echo "path=$dst" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: WarOfGenesis-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Upload to GitHub Releases
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.apk.outputs.path }}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${{ steps.apk.outputs.path }}" --repo "$GITHUB_REPOSITORY" \
              --title "안드로이드 $tag" \
              --notes "창세기전3 리메이크 안드로이드판 APK. 디버그 키로 서명했으므로 새 버전을 깔 때 옛 앱을 먼저 지워야 할 수 있습니다."
          fi
